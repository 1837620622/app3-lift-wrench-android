name: Android CI
run-name: Android 0.2.0 build ${{ github.run_number }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  APP3_ANDROID_BUILD_ROOT: ${{ github.workspace }}/.build
  GRADLE_OPTS: -Dorg.gradle.daemon=false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check source publication scope
        run: python3 tools/source_guard.py
      - name: Check shell scripts
        run: shellcheck tools/emulator_test.sh
      - name: Prepare stable debug signing
        if: github.event_name != 'pull_request'
        env:
          APP3_DEBUG_KEYSTORE_BASE64: ${{ secrets.APP3_DEBUG_KEYSTORE_BASE64 }}
          APP3_DEBUG_STORE_PASSWORD: ${{ secrets.APP3_DEBUG_STORE_PASSWORD }}
        run: python3 tools/prepare_debug_signing.py
      - name: Unit tests, lint and both build variants
        working-directory: App3Android
        env:
          APP3_DEBUG_KEYSTORE: ${{ runner.temp }}/app3-debug.p12
          APP3_DEBUG_STORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APP3_DEBUG_STORE_PASSWORD || '' }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease --stacktrace --console=plain -Papp3.versionCode=$((1000 + GITHUB_RUN_NUMBER))
      - name: Verify APK signature and version
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs .build/app/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging .build/app/outputs/apk/debug/app-debug.apk > .build/app/outputs/apk/debug/apk-metadata.txt
          grep -F "versionCode='$((1000 + GITHUB_RUN_NUMBER))'" .build/app/outputs/apk/debug/apk-metadata.txt
          grep -F "versionName='0.2.0-debug.$((1000 + GITHUB_RUN_NUMBER))'" .build/app/outputs/apk/debug/apk-metadata.txt
          sha256sum .build/app/outputs/apk/debug/app-debug.apk > .build/app/outputs/apk/debug/SHA256SUMS
      - name: APK and emulator test APK
        uses: actions/upload-artifact@v4
        with:
          name: app3-debug-${{ github.run_number }}
          path: |
            .build/app/outputs/apk/debug/*.apk
            .build/app/outputs/apk/debug/apk-metadata.txt
            .build/app/outputs/apk/debug/SHA256SUMS
            .build/app/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Unit and lint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-checks-${{ github.run_number }}
          path: |
            .build/app/reports/tests/
            .build/app/test-results/
            .build/app/reports/lint-results-debug.*
          retention-days: 14
  emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            density: 240
            font: '1.0'
          - api: 35
            density: 320
            font: '1.3'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: app3-debug-${{ github.run_number }}
          path: apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/emulator_test.sh '${{ matrix.density }}' '${{ matrix.font }}'
      - name: Synthetic-data UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-api${{ matrix.api }}-${{ github.run_number }}
          path: ui-evidence/
          if-no-files-found: error
          retention-days: 14
