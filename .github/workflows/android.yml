name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App3Android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain -Papp3.android.buildRoot="$RUNNER_TEMP/app3-android-build"

      - name: Android lint
        run: ./gradlew lintDebug --console=plain -Papp3.android.buildRoot="$RUNNER_TEMP/app3-android-build"

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain -Papp3.android.buildRoot="$RUNNER_TEMP/app3-android-build"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app3-wrench-lift-debug-apk
          path: ${{ runner.temp }}/app3-android-build/app/outputs/apk/debug/*.apk
          if-no-files-found: error
